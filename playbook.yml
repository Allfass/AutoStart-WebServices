---
- name: Deploy Production All-in-One Nginx + 3x-ui Stack on Debian 13 (Trixie)
  hosts: vpn_nodes
  become: true
  gather_facts: true

  vars:
    # --- Основные сетевые параметры и Домен ---
    domain_name: "blog.example.com"
    letsencrypt_email: "admin@example.com"
    timezone: "UTC"

    # --- Параметры 3x-ui ---
    xui_install_dir: "/opt/3x-ui"
    xui_image: "ghcr.io/mhsanaei/3x-ui:latest"
    xui_panel_port: 2053
    xui_xray_ws_port: 10000
    # Секретный путь (без слешей по краям — слеши добавятся автоматически в шаблонах)
    xui_web_base_path: "secret-panel-path"
    xui_xray_ws_path: "ray-stream"
    xui_admin_user: "admin"
    xui_admin_password: "ChangeMe_StrongPassword123!"

    # --- Параметры сайта-заглушки ---
    web_root: "/var/www/{{ domain_name }}"
    site_title: "Alexey Dev — Заметки об архитектуре и Linux"

    # --- Мониторинг и SNMP ---
    snmp_bind_address: "127.0.0.1" # Замените на IP мониторинг-сервера при внешнем опросе
    snmp_ro_community: "Prod_SNMP_RO_Secret"
    snmp_location: "Frankfurt DC-1"
    snmp_contact: "ops@example.com"
    ssl_expiry_warn_days: 14

    # --- Оповещения по Email (msmtp) ---
    alert_email_to: "ops-alerts@example.com"
    smtp_host: "smtp.example.com"
    smtp_port: 587
    smtp_from: "noreply-vpn@example.com"
    smtp_user: "noreply-vpn@example.com"
    smtp_password: "ChangeMe_SmtpPassword!"

  tasks:
    # =========================================================================
    # 1. БАЗОВАЯ ПОДГОТОВКА СИСТЕМЫ И РЕПОЗИТОРИЯ DOCKER (DEBIAN 13 TRIXIE)
    # =========================================================================
    - name: Set system timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Install base system packages, Nginx, Certbot, SNMP, and Mail agent
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - nginx
          - certbot
          - python3-certbot-nginx
          - snmpd
          - msmtp
          - msmtp-mta
          - bsd-mailx
          - unattended-upgrades
          - apt-listchanges
          - openssl
        state: present
        update_cache: true

    - name: Create directory for apt keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configure Docker DEB822 repository for Debian 13 (Trixie)
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/debian"
        suites: ["{{ ansible_distribution_release | default('trixie') }}"]
        components: [stable]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
      register: docker_repo

    - name: Install Docker Engine and Docker Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: "{{ docker_repo.changed }}"

    - name: Ensure Docker service is running and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    # =========================================================================
    # 2. НАСТРОЙКА САЙТА-ЗАГЛУШКИ, NGINX И LET'S ENCRYPT SSL
    # =========================================================================
    - name: Create directories for fake website and ACME challenge
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"
      loop:
        - "{{ web_root }}"
        - "/var/www/letsencrypt"

    - name: Deploy camouflage landing page (index.html)
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: "{{ web_root }}/index.html"
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Check if Let's Encrypt certificate already exists
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
      register: le_cert_stat

    - name: Deploy initial HTTP-only Nginx configuration (for Certbot bootstrap)
      ansible.builtin.template:
        src: templates/nginx-http.conf.j2
        dest: "/etc/nginx/sites-available/{{ domain_name }}.conf"
        mode: "0644"
      when: not le_cert_stat.stat.exists

    - name: Enable Nginx virtual host
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ domain_name }}.conf"
        dest: "/etc/nginx/sites-enabled/{{ domain_name }}.conf"
        state: link
      notify: Reload Nginx

    - name: Ensure Nginx is started before requesting SSL certificate
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

    - name: Flush handlers to apply HTTP configuration before Certbot run
      ansible.builtin.meta: flush_handlers

    # Единственный необходимый вызов command для первичного выпуска сертификата
    - name: Issue Let's Encrypt SSL certificate via webroot
      ansible.builtin.command: >
        certbot certonly --webroot
        -w /var/www/letsencrypt
        -d {{ domain_name }}
        --email {{ letsencrypt_email }}
        --agree-tos
        --non-interactive
      args:
        creates: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"

    - name: Configure Certbot deploy hook to reload Nginx automatically on renewal
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
        content: |
          #!/bin/sh
          systemctl reload nginx
        mode: "0755"

    - name: Ensure certbot.timer is enabled and active
      ansible.builtin.systemd:
        name: certbot.timer
        state: started
        enabled: true

    - name: Deploy production HTTPS Nginx configuration (Reverse Proxy + Hardening)
      ansible.builtin.template:
        src: templates/nginx-https.conf.j2
        dest: "/etc/nginx/sites-available/{{ domain_name }}.conf"
        mode: "0644"
      notify: Reload Nginx

    # =========================================================================
    # 3. РАЗВЕРТЫВАНИЕ 3X-UI В DOCKER COMPOSE
    # =========================================================================
    - name: Create 3x-ui directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "{{ xui_install_dir }}"
        - "{{ xui_install_dir }}/db"
        - "{{ xui_install_dir }}/cert"

    - name: Deploy Docker Compose manifest for 3x-ui
      ansible.builtin.template:
        src: templates/docker-compose.yml.j2
        dest: "{{ xui_install_dir }}/docker-compose.yml"
        mode: "0640"

    - name: Deploy 3x-ui container via community.docker.docker_compose_v2
      community.docker.docker_compose_v2:
        project_src: "{{ xui_install_dir }}"
        state: present
        pull: policy

    - name: Wait for 3x-ui SQLite database initialization
      ansible.builtin.wait_for:
        path: "{{ xui_install_dir }}/db/x-ui.db"
        state: present
        timeout: 30

    - name: Enforce custom Web Base Path, Port and Credentials inside 3x-ui container
      community.docker.docker_container_exec:
        container: 3x-ui
        argv:
          - /app/x-ui
          - setting
          - -username
          - "{{ xui_admin_user }}"
          - -password
          - "{{ xui_admin_password }}"
          - -port
          - "{{ xui_panel_port | string }}"
          - -webBasePath
          - "/{{ xui_web_base_path }}/"
      register: xui_config_result
      changed_when: false
      no_log: true

    # =========================================================================
    # 4. АВТОМАТИЧЕСКОЕ ОБСЛУЖИВАНИЕ (UNATTENDED-UPGRADES + SAFE REBOOT)
    # =========================================================================
    - name: Configure Unattended-Upgrades for Debian 13 security updates
      ansible.builtin.template:
        src: templates/50unattended-upgrades.j2
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        mode: "0644"

    - name: Enable periodic APT updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";

    - name: Deploy pre-checked safe reboot script
      ansible.builtin.template:
        src: templates/safe-reboot.sh.j2
        dest: /usr/local/sbin/safe-reboot.sh
        mode: "0750"

    - name: Create systemd service for safe daily reboot
      ansible.builtin.copy:
        dest: /etc/systemd/system/safe-reboot.service
        mode: "0644"
        content: |
          [Unit]
          Description=Safe Daily Server Reboot with Pre-flight Checks
          After=network.target docker.service nginx.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/safe-reboot.sh
      notify: Reload systemd

    - name: Create systemd timer for daily reboot at 04:00 AM
      ansible.builtin.copy:
        dest: /etc/systemd/system/safe-reboot.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Run Safe Daily Server Reboot at 04:00 AM

          [Timer]
          OnCalendar=*-*-* 04:00:00
          Persistent=false

          [Install]
          WantedBy=timers.target
      notify: Reload systemd

    # =========================================================================
    # 5. МОНИТОРИНГ И ОПОВЕЩЕНИЯ (SNMPD + MSMTP + HEALTHCHECK SERVICE)
    # =========================================================================
    - name: Deploy SNMP daemon configuration
      ansible.builtin.template:
        src: templates/snmpd.conf.j2
        dest: /etc/snmp/snmpd.conf
        mode: "0600"
      notify: Restart snmpd

    - name: Ensure snmpd is started and enabled
      ansible.builtin.systemd:
        name: snmpd
        state: started
        enabled: true

    - name: Configure msmtp for outbound email alerts
      ansible.builtin.template:
        src: templates/msmtprc.j2
        dest: /etc/msmtprc
        owner: root
        group: mail
        mode: "0640"
      no_log: true

    - name: Deploy system & VPN healthcheck script
      ansible.builtin.template:
        src: templates/system-healthcheck.sh.j2
        dest: /usr/local/sbin/system-healthcheck.sh
        mode: "0750"

    - name: Create systemd service for healthcheck
      ansible.builtin.copy:
        dest: /etc/systemd/system/vpn-healthcheck.service
        mode: "0644"
        content: |
          [Unit]
          Description=Monitor Nginx, SSL Certificate, and 3x-ui Docker Container
          After=network.target nginx.service docker.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/system-healthcheck.sh
      notify: Reload systemd

    - name: Create systemd timer for healthcheck (every 5 minutes)
      ansible.builtin.copy:
        dest: /etc/systemd/system/vpn-healthcheck.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Run VPN Stack Healthcheck every 5 minutes

          [Timer]
          OnBootSec=3min
          OnUnitActiveSec=5min

          [Install]
          WantedBy=timers.target
      notify: Reload systemd

    - name: Flush handlers before enabling timers
      ansible.builtin.meta: flush_handlers

    - name: Enable and start maintenance and monitoring systemd timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - safe-reboot.timer
        - vpn-healthcheck.timer

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Reload Nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

    - name: Restart snmpd
      ansible.builtin.systemd:
        name: snmpd
        state: restarted